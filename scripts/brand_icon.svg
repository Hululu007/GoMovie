<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="crimsonGold" x1="160" y1="220" x2="860" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E54"/>
      <stop offset="55%" stop-color="#FF6347"/>
      <stop offset="100%" stop-color="#FF9E2C"/>
    </linearGradient>
    <linearGradient id="foldShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8143B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF9E2C" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#FF2E54" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- 折纸立体 G 主体 -->
    <path d="M518 282 H302 L226 358 V666 L302 742 H518 V502 H392 V582 H442 V662 H316 V362 H442 V418 L518 356 Z" fill="url(#crimsonGold)"/>
