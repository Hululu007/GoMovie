    <path d="M392 502 H518 L442 582 H392 Z" fill="#FFD166" opacity="0.28"/>
    <!-- 锐利折纸播放箭头 -->
    <path d="M578 308 L836 512 L578 716 L662 512 Z" fill="url(#crimsonGold)"/>
    <path d="M578 308 L836 512 L662 512 Z" fill="#FFE082" opacity="0.22"/>
