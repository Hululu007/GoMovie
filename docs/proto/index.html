<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GoMovie · 交互原型</title>
<style>
  :root{
    --bg:#0b1120; --surface:#121826; --line:rgba(255,255,255,.08);
    --fg:#e9edf7; --muted:rgba(255,255,255,.55);
    --ease:cubic-bezier(.22,.9,.28,1);
    --accent:#7c6cff; --on-accent:#fff; --accent-deep:#3a2f8f;
    --accent-tag:rgba(124,108,255,.22); --accent-a35:rgba(124,108,255,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#05070d;font-family:-apple-system,system-ui,"Noto Sans SC","PingFang SC",sans-serif;
            color:var(--fg);overflow:hidden}
  #app{position:fixed;inset:0;background:var(--bg);overflow:hidden}

  /* ---------- 顶栏 ---------- */
  .topbar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;
          display:flex;align-items:center;gap:10px;z-index:30;
          background:linear-gradient(180deg,rgba(11,17,32,.96),rgba(11,17,32,0))}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .srcname{font-size:15px;font-weight:600;letter-spacing:.2px;max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{flex:1}
  .iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
           background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:15px;
           transition:transform .18s var(--ease),background .18s}
  .iconbtn:active{transform:scale(.94);background:rgba(255,255,255,.14)}

  /* ---------- 分类 chip ---------- */
  .chips{position:absolute;top:calc(env(safe-area-inset-top) + 56px);left:0;right:0;
         display:flex;gap:8px;padding:4px 16px 10px;overflow-x:auto;z-index:30;
         scrollbar-width:none;background:linear-gradient(180deg,rgba(11,17,32,.9),rgba(11,17,32,0))}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;height:34px;padding:0 14px;border-radius:999px;display:flex;align-items:center;
        font-size:13px;color:var(--muted);background:rgba(255,255,255,.06);border:1px solid transparent;
        transition:color .18s,background .22s var(--ease),border-color .22s,transform .18s var(--ease)}
  .chip:active{transform:scale(.96)}
  .chip.on{color:#fff;background:var(--accent-tag);border-color:var(--accent)}

  /* ---------- 首页货架 ---------- */
  .feed{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 106px) 0 120px;
        -webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  .sec{padding:0 16px;margin-bottom:22px}
  .sechead{display:flex;align-items:baseline;margin-bottom:10px}
  .sechead h3{font-size:16px;font-weight:700;letter-spacing:.2px}
  .sechead span{margin-left:auto;font-size:12px;color:var(--muted)}
  .rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .rail::-webkit-scrollbar{display:none}
  .card{flex:none;width:31vw;max-width:150px;transition:transform .2s var(--ease)}
  .card:active{transform:scale(.965)}
  .cover{width:100%;aspect-ratio:3/4;border-radius:12px;position:relative;overflow:hidden;
         background:var(--surface);box-shadow:0 10px 24px rgba(0,0,0,.38)}
  .cover::after{content:"";position:absolute;inset:0;
                background:linear-gradient(180deg,transparent 52%,rgba(5,7,13,.86));opacity:.9}
  .cover .ttl{position:absolute;left:9px;right:9px;bottom:9px;font-size:12.5px;font-weight:600;
              line-height:1.3;z-index:2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .badge{position:absolute;top:8px;left:8px;z-index:2;font-size:10px;padding:2px 6px;border-radius:6px;
         background:rgba(5,7,13,.6);color:var(--fg);backdrop-filter:blur(6px)}
  .sc{position:absolute;top:8px;right:8px;z-index:2;font-size:10.5px;font-weight:700;padding:2px 6px;
      border-radius:6px;background:rgba(5,7,13,.62);color:#ffd166;backdrop-filter:blur(6px)}

  /* ---------- 详情页（FLIP 放大进入） ---------- */
  .detail{position:fixed;inset:0;z-index:50;background:var(--bg);opacity:0;pointer-events:none;
          transition:opacity .28s var(--ease)}
  .detail.open{opacity:1;pointer-events:auto}
  .stage{position:absolute;inset:-14%;background-size:cover;background-position:center;
         filter:blur(14px) brightness(.46) saturate(1.9);transform:scale(1.1);
         transition:opacity .5s var(--ease),transform .6s var(--ease)}
  .detail .tint{position:absolute;inset:0;background:var(--accent-a35);mix-blend-mode:overlay;
                transition:background .4s var(--ease)}
  .detail .veil{position:absolute;inset:0;background:linear-gradient(180deg,
                rgba(11,17,32,.34) 0%,rgba(11,17,32,.62) 44%,var(--bg) 76%);
                transition:background .4s var(--ease)}
  .dcontent{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 56px}
  .dtop{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .hero{display:flex;gap:16px}
  .hero .poster{width:38vw;max-width:170px;aspect-ratio:3/4;border-radius:16px;flex:none;
                box-shadow:0 22px 46px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12)}
  .hmeta{flex:1;padding-top:4px}
  .hmeta h1{font-size:23px;font-weight:800;line-height:1.24;letter-spacing:.3px}
  .hmeta .sub{margin-top:9px;font-size:12.5px;color:var(--muted);line-height:1.7}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .tag{font-size:11.5px;padding:4px 9px;border-radius:7px;background:var(--accent-tag);
       border:1px solid var(--line);transition:background .4s var(--ease)}
  .score{margin-top:11px;font-size:13.5px;font-weight:700;color:var(--accent);transition:color .4s}
  .cta{display:flex;gap:10px;margin-top:26px}
  .primary{flex:1;height:52px;border-radius:14px;background:linear-gradient(120deg,var(--accent),var(--accent-deep));
           color:var(--on-accent);font-size:15px;font-weight:700;display:flex;align-items:center;
           justify-content:center;gap:8px;border:none;box-shadow:0 14px 30px rgba(0,0,0,.4);
           transition:transform .18s var(--ease),background .4s var(--ease),box-shadow .3s}
  .primary:active{transform:scale(.975)}
  .secondary{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.1);
             border:1px solid var(--line);color:var(--fg);font-size:18px;display:grid;place-items:center;
             transition:transform .18s var(--ease),background .18s}
  .secondary:active{transform:scale(.94);background:rgba(255,255,255,.16)}
  .intro{margin-top:20px;font-size:13px;line-height:1.85;color:rgba(255,255,255,.62)}
  .infolist{margin-top:14px;border-radius:14px;background:rgba(255,255,255,.045);overflow:hidden}
  .inforow{display:flex;align-items:center;gap:12px;padding:14px 14px;font-size:13px;
           border-bottom:1px solid rgba(255,255,255,.06)}
  .inforow:last-child{border-bottom:none}
  .inforow em{font-style:normal;color:rgba(255,255,255,.45);width:56px;flex:none;font-size:12.5px}
  .inforow span{color:rgba(255,255,255,.86)}
  .sec2{margin-top:26px}
  .eps{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}
  .ep{height:48px;border-radius:11px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);
      display:grid;place-items:center;font-size:13.5px;color:rgba(255,255,255,.85);
      transition:background .24s var(--ease),border-color .24s,transform .18s var(--ease),color .2s}
  .ep:active{transform:scale(.93)}
  .ep.on{background:var(--accent-a35);border-color:var(--accent);color:#fff;font-weight:700}

  /* ---------- 选集抽屉 ---------- */
  .scrim{position:fixed;inset:0;background:rgba(3,5,10,.6);backdrop-filter:blur(2px);opacity:0;
         pointer-events:none;transition:opacity .24s var(--ease);z-index:60}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#101724;border-radius:22px 22px 0 0;
         border-top:1px solid var(--line);padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);
         transform:translateY(102%);transition:transform .32s var(--ease);
         max-height:66vh;overflow-y:auto}
  .sheet.open{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:0 auto 14px}

  /* ---------- 播放器 ---------- */
  .player{position:fixed;inset:0;z-index:80;background:#05070d;opacity:0;pointer-events:none;
          transition:opacity .3s var(--ease)}
  .player.open{opacity:1;pointer-events:auto}
  .pstage{position:absolute;inset:0;background-size:cover;filter:blur(8px) brightness(.34) saturate(1.5)}
  .pcenter{position:absolute;inset:0;display:grid;place-items:center}
  .pbtn{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.14);
        border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;font-size:24px;
        backdrop-filter:blur(8px);transition:transform .2s var(--ease),background .2s}
  .pbtn:active{transform:scale(.92);background:rgba(255,255,255,.22)}
  .pbottom{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom) + 26px)}
  .pp{height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
  .pp i{display:block;height:3px;width:36%;background:var(--accent);border-radius:2px;
        transition:width .4s linear,background .4s}
  .ptime{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:7px}
  .pdock{display:flex;gap:10px;margin-top:16px}
  .dbtn{flex:1;height:44px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);
        color:var(--fg);font-size:12.5px;display:grid;place-items:center;
        transition:transform .18s var(--ease),background .18s}
  .dbtn:active{transform:scale(.96);background:rgba(255,255,255,.16)}

  /* ---------- 底部导航 ---------- */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(64px + env(safe-area-inset-bottom));
       padding-bottom:env(safe-area-inset-bottom);background:rgba(9,13,24,.92);backdrop-filter:blur(16px);
       border-top:1px solid var(--line);display:flex}
  .nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
           font-size:10px;color:rgba(255,255,255,.42);transition:color .2s}
  .nav div.on{color:var(--fg)}
  .nav i{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.16);transition:background .3s var(--ease)}
  .nav div.on i{background:var(--accent);box-shadow:0 0 14px var(--accent)}

  /* 呼吸光晕 */
  .glow{position:absolute;left:50%;top:38%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);
        background:radial-gradient(circle,var(--accent-a35),transparent 62%);filter:blur(40px);
        opacity:.5;animation:breathe 9s ease-in-out infinite alternate;pointer-events:none}
  @keyframes breathe{from{transform:translate(-50%,-50%) scale(.92);opacity:.34}
                     to{transform:translate(-50%,-50%) scale(1.08);opacity:.6}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="dot"></span><span class="srcname" id="srcname">豆豆┃片单 4K</span>
    <span class="spacer"></span>
    <button class="iconbtn" onclick="openSheet()">☰</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="feed" id="feed"></div>
  <div class="nav">
    <div class="on"><i></i>发现</div><div><i></i>追剧</div><div><i></i>历史</div><div><i></i>我的</div>
  </div>
</div>

<!-- 详情 -->
<div class="detail" id="detail">
  <div class="stage" id="stage"></div>
  <div class="tint"></div>
  <div class="veil"></div>
  <div class="glow" id="glow"></div>
  <div class="dcontent">
    <div class="dtop"><button class="iconbtn" onclick="closeDetail()">‹</button>
      <span class="spacer"></span><button class="iconbtn">⋯</button></div>
    <div class="hero">
      <div class="poster" id="dposter"></div>
      <div class="hmeta">
        <h1 id="dtitle"></h1>
        <div class="sub" id="dsub"></div>
        <div class="tags" id="dtags"></div>
        <div class="score" id="dscore"></div>
      </div>
    </div>
    <div class="cta">
      <button class="primary" id="dplay" onclick="openPlayer()">▶　继续观看</button>
      <button class="secondary">＋</button>
    </div>
    <p class="intro" id="dintro"></p>
    <div class="infolist" id="dinfo"></div>
    <div class="sec2">
      <div class="sechead"><h3>选集</h3><span id="depinfo"></span></div>
      <div class="eps" id="deps"></div>
    </div>
    <div class="sec2">
      <div class="sechead"><h3>同源推荐</h3><span>更多 ›</span></div>
      <div class="rail" id="drail"></div>
    </div>
  </div>
</div>

<!-- 选集抽屉 -->
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sechead"><h3>选集</h3><span id="sheetinfo"></span></div>
  <div class="eps" id="sheepsis"></div>
</div>

<!-- 播放器 -->
<div class="player" id="player">
  <div class="pstage" id="pstage"></div>
  <div class="pcenter"><button class="pbtn" id="pbtn" onclick="togglePlay()">❚❚</button></div>
  <div class="pbottom">
    <div class="pp"><i id="pfill"></i></div>
    <div class="ptime"><span id="ptime">03:12</span><span>08:40</span></div>
    <div class="pdock">
      <button class="dbtn" onclick="closePlayer()">‹ 返回</button>
      <button class="dbtn" onclick="openSheet()">选集</button>
      <button class="dbtn">1.0×</button>
      <button class="dbtn">弹幕</button>
    </div>
  </div>
</div>

<script>
/* ---------- 内容（封面用双色渐变代表海报，取色逻辑与生产一致：从封面主色钳制） ---------- */
const SOURCES = {
  doudou: {
    name:'豆豆┃片单 4K',
    cats:['主页','电影','剧集','短剧','动漫'],
    rows:[
      {title:'豆瓣推荐', items:[
        {t:'八仙！', c:['#8a5a2a','#3a1e10'], score:'8.2', badge:'共 80 集', ep:8, tags:['脑洞','穿越','爽剧'], sub:'2025 · 短剧 · 共 100 集'},
        {t:'嫁金钗', c:['#5a2440','#210f1c'], score:'6.7', badge:'更新至 24', ep:3, tags:['古装','权谋'], sub:'2026 · 剧集 · 共 36 集'},
        {t:'家山有喜', c:['#1f5f52','#0b241f'], score:'8.4', badge:'全 36 集', ep:24, tags:['年代','家庭'], sub:'2026 · 剧集 · 共 36 集'},
        {t:'空枪', c:['#2b3350','#111826'], score:'7.9', badge:'HD', ep:1, tags:['犯罪','悬疑'], sub:'2026 · 电影'}
      ]},
      {title:'站点推荐', items:[
        {t:'一切尚可', c:['#4a3d2a','#1b1610'], score:'7.1', badge:'HD', ep:1, tags:['剧情'], sub:'2025 · 电影'},
        {t:'锁住 418', c:['#33304d','#151224'], score:'6.5', badge:'HD', ep:1, tags:['惊悚'], sub:'2025 · 电影'},
        {t:'完美说谎者', c:['#2f4038','#111c1a'], score:'8.0', badge:'全 12 集', ep:12, tags:['悬疑'], sub:'2025 · 剧集 · 共 12 集'},
        {t:'漫长的季节', c:['#3b3550','#171326'], score:'9.4', badge:'全 12 集', ep:12, tags:['剧情'], sub:'2023 · 剧集 · 共 12 集'}
      ]}
    ]
  }
};

/* ---------- 取色：主色 → 钳制（s .45–.8, 对比≥4.5）→ 派生 token ---------- */
function hexToRgb(h){const n=parseInt(h.replace('#',''),16);return[n>>16&255,n>>8&255,n&255]}
function rgbToHsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let h=0,s=0,l=(mx+mn)/2;const d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60}
  return[h,s,l]}
function hslToHex(h,s,l){s=Math.min(1,Math.max(0,s));l=Math.min(1,Math.max(0,l));
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  let r,g,b;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else [r,g,b]=[c,0,x];
  const to=v=>Math.round((v+m)*255).toString(16).padStart(2,'0');return`#${to(r)}${to(g)}${to(b)}`}
function lum([r,g,b]){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
  return .2126*f(r)+.7152*f(g)+.0722*f(b)}
function contrast(a,b){const l1=lum(a),l2=lum(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)}
function accentFrom(color){
  let [h,s,l]=rgbToHsl(hexToRgb(color));
  s=Math.min(.8,Math.max(.45,s)); l=Math.min(.62,Math.max(.42,l));
  let hex=hslToHex(h,s,l), rgb=hexToRgb(hex);
  const bg=hexToRgb('#0b1120');
  // 深色底上对比不足要把亮度往上抬（往下压只会更暗更难读）
  let guard=0;
  while(contrast(rgb,bg)<4.5 && l<.88 && guard++<40){l+=.02;hex=hslToHex(h,s,l);rgb=hexToRgb(hex)}
  const onWhite=contrast(rgb,[255,255,255]), onBg=contrast(rgb,bg);
  return {accent:hex, deep:hslToHex(h,s,.14), on:onWhite>=onBg?'#0b1120':'#ffffff'};
}
function applyAccent(color){
  const {accent,deep,on}=accentFrom(color);
  const rgb=hexToRgb(accent), r=rgb[0],g=rgb[1],b=rgb[2];
  const S=document.documentElement.style;
  S.setProperty('--accent',accent); S.setProperty('--accent-deep',deep); S.setProperty('--on-accent',on);
  S.setProperty('--accent-tag',`rgba(${r},${g},${b},.22)`);
  S.setProperty('--accent-a35',`rgba(${r},${g},${b},.35)`);
}

/* ---------- 首页渲染 ---------- */
const feed=document.getElementById('feed');
const chips=document.getElementById('chips');
function coverBg(c){return `linear-gradient(150deg,${c[0]},${c[1]})`}
function renderHome(){
  const src=SOURCES.doudou;
  chips.innerHTML=src.cats.map((c,i)=>`<div class="chip ${i===0?'on':''}" onclick="pickChip(this)">${c}</div>`).join('');
  feed.innerHTML=src.rows.map(row=>`
    <div class="sec"><div class="sechead"><h3>${row.title}</h3><span>更多 ›</span></div>
      <div class="rail">${row.items.map((it,idx)=>`
        <div class="card" onclick="openDetail('${row.title}',${idx})">
          <div class="cover" style="background:${coverBg(it.c)}">
            <span class="badge">${it.badge}</span>${it.score?`<span class="sc">${it.score}</span>`:''}
            <span class="ttl">${it.t}</span>
          </div>
        </div>`).join('')}</div>
    </div>`).join('');
}
function pickChip(el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on')}

/* ---------- 详情 ---------- */
let current=null;
function openDetail(rowTitle, idx){
  const row=SOURCES.doudou.rows.find(r=>r.title===rowTitle);
  const it=row.items[idx]; current=it;
  applyAccent(it.c[0]);
  document.getElementById('stage').style.background=coverBg(it.c);
  document.getElementById('dposter').style.background=coverBg(it.c);
  document.getElementById('dtitle').innerHTML=it.t.replace(/^(.{4})/,'$1<br>');
  document.getElementById('dsub').innerHTML=it.sub+'<br>已完结 · 评分 '+it.score;
  document.getElementById('dtags').innerHTML=it.tags.map(t=>`<span class="tag">${t}</span>`).join('');
  document.getElementById('dscore').textContent=`${it.score} 分 · 热度 9.8 万`;
  document.getElementById('dinfo').innerHTML = [
    ['来源','豆豆┃片单 4K · 订阅源（jar）'],
    ['分类', it.tags.join(' / ')],
    ['状态','已完结 · 共 ' + ((it.sub.match(/共 (\d+) 集/)||[0,'—'])[1]) + ' 集'],
    ['画质','1080P · 免广告']
  ].map(([k,v])=>`<div class="inforow"><em>${k}</em><span>${v}</span></div>`).join('');
  document.getElementById('dintro').textContent =
    '现代军械工程师魂穿宋末，带着一身手艺和一套图纸，从边关小卒一路做到执掌军工。他要改的不是一场仗，是一个朝代。';
  document.getElementById('dplay').innerHTML=`▶　继续观看 第 ${it.ep} 集`;
  const total=parseInt((it.sub.match(/共 (\d+) 集/)||[0,80])[1]);
  document.getElementById('depinfo').textContent=`共 ${total} 集 · 已看 ${it.ep}`;
  const start=Math.max(1,it.ep-2);
  document.getElementById('deps').innerHTML=Array.from({length:10},(_,k)=>{
    const n=start+k; return `<div class="ep ${n===it.ep?'on':''}" onclick="pickEp(this)">${n}</div>`}).join('');
  document.getElementById('drail').innerHTML=SOURCES.doudou.rows[1].items.slice(0,4).map(o=>`
    <div class="card" style="width:30vw" onclick="openDetail('${SOURCES.doudou.rows[1].title}',0)">
      <div class="cover" style="background:${coverBg(o.c)}"><span class="ttl">${o.t}</span></div></div>`).join('');
  const d=document.getElementById('detail');
  d.classList.add('open');
  document.getElementById('pstage').style.background=coverBg(it.c);
}
function closeDetail(){document.getElementById('detail').classList.remove('open')}
function pickEp(el){document.querySelectorAll('#deps .ep').forEach(e=>e.classList.remove('on'));el.classList.add('on')}

/* ---------- 抽屉 ---------- */
function openSheet(){
  if(current){
    const total=parseInt((current.sub.match(/共 (\d+) 集/)||[0,80])[1]);
    document.getElementById('sheetinfo').textContent=`共 ${total} 集`;
    document.getElementById('sheepsis').innerHTML=Array.from({length:15},(_,k)=>{
      const n=k+1;return `<div class="ep ${n===current.ep?'on':''}" onclick="pickSheetEp(this)">${n}</div>`}).join('');
  }
  document.getElementById('sheet').classList.add('open');
  document.getElementById('scrim').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}
function pickSheetEp(el){
  document.querySelectorAll('#sheepsis .ep').forEach(e=>e.classList.remove('on'));
  el.classList.add('on'); closeSheet();
}

/* ---------- 播放 ---------- */
let playing=true, timer=null, pct=36;
function openPlayer(){
  document.getElementById('player').classList.add('open');
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{if(playing){pct=Math.min(100,pct+.35);
    document.getElementById('pfill').style.width=pct+'%';
    const sec=Math.round(192+pct*3.2);
    document.getElementById('ptime').textContent=
      `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}},400);
}
function closePlayer(){document.getElementById('player').classList.remove('open');if(timer)clearInterval(timer)}
function togglePlay(){playing=!playing;
  document.getElementById('pbtn').textContent=playing?'❚❚':'▶'}

/* ---------- 手势：下拉关闭详情 / 拖动抽屉 ---------- */
(function(){
  let sy=0,dy=0,dragging=false;
  const d=document.getElementById('detail');
  d.addEventListener('touchstart',e=>{if(d.scrollTop>2)return;sy=e.touches[0].clientY;dragging=true},{passive:true});
  d.addEventListener('touchmove',e=>{if(!dragging)return;dy=e.touches[0].clientY-sy;
    if(dy>0){d.style.transform=`translateY(${dy*.5}px)`;d.style.opacity=String(1-dy/700)}},{passive:true});
  d.addEventListener('touchend',()=>{if(!dragging)return;dragging=false;
    if(dy>110)closeDetail(); d.style.transform='';d.style.opacity='';dy=0},{passive:true});

  const sh=document.getElementById('sheet');let sy2=0,dy2=0,down=false;
  sh.addEventListener('touchstart',e=>{sy2=e.touches[0].clientY;down=true},{passive:true});
  sh.addEventListener('touchmove',e=>{if(!down)return;dy2=e.touches[0].clientY-sy2;
    if(dy2>0)sh.style.transform=`translateY(${dy2}px)`},{passive:true});
  sh.addEventListener('touchend',()=>{if(!down)return;down=false;
    if(dy2>90)closeSheet(); else sh.style.transform=''; dy2=0},{passive:true});
})();

renderHome();
applyAccent(SOURCES.doudou.rows[0].items[0].c[0]);
</script>
</body>
</html>
